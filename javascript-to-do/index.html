<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h1 class="tex-center my-5">ToDo app</h1>
        <form id="formulario">
            <input type="text" autofocus
            placeholder="ingrese tarea"
            class="form-control my-2" id="input">
            <button class="btn btn-block btn-primary" type="submit">Agregar</button>
            

        </form>
        <div id="lista-tareas" class="mt-3">
            <div class="alert-dark text-center">
                No hay tareas pendientes 😎
            </div>
        </div>
    </div>
    <template id="template">
        <div class="alert alert-warning d-flex d-flex justify-content-between d-flex align-items-center">
                <p class="m-0">Tarea #1</p>
                <h3 class="m-0">
                <i class="fa-solid fa-circle-check" style="color: rgb(8, 170, 48);" role="button"></i>
                <i class="fa-solid fa-circle-minus" style="color: rgb(216, 12, 12);"role="button"></i>
            
                </h3>
            </div>

            
    </template>
    <script src="app.js"></script>
</body>
</html>
